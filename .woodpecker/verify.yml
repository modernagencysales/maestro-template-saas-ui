labels:
  platform: linux/amd64
  role: factory-ci

clone:
  git:
    image: woodpeckerci/plugin-git:2.9.2@sha256:ebde4a4d07e0e24b630082484d192890dd4f6d442d90bf5466f0763860f83652
    settings:
      depth: 1
      partial: false
      tags: false

when:
  - event: pull_request
    status: [success, failure]

depends_on:
  - verify-core
  - verify-coverage

steps:
  - name: aggregate
    # Keep ci/woodpecker/pr/verify terminal and red when either required lane fails.
    image: node:22.23.2-bookworm@sha256:0557ac14e0d45d02ed563067b82856ca5e7aa3437fa28d98d4350ea9c3d9494a
    commands:
      - node tooling/ci/verify-aggregate.mjs
