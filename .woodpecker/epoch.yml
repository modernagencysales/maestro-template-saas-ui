labels:
  platform: linux/amd64
  role: factory-ci
  class: epoch

timeout: 60

clone:
  git:
    image: woodpeckerci/plugin-git:2.9.2@sha256:ebde4a4d07e0e24b630082484d192890dd4f6d442d90bf5466f0763860f83652
    settings:
      depth: 500
      partial: false
      tags: true

when:
  - event: manual

steps:
  - name: epoch
    image: node:22.12.0-bookworm@sha256:0e910f435308c36ea60b4cfd7b80208044d77a074d16b768a81901ce938a62dc
    environment:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=6144"
    commands:
      - tooling/ci/epoch.sh
    failure: cancel
