labels:
  platform: linux/amd64
  role: factory-ci
  class: firewall

timeout: 15

clone:
  git:
    image: woodpeckerci/plugin-git:2.9.2@sha256:ebde4a4d07e0e24b630082484d192890dd4f6d442d90bf5466f0763860f83652
    settings:
      depth: 500
      partial: false
      tags: true
      fetch-target-branch: true
      target-branch: main

when:
  - event: pull_request
    evaluate: 'CI_COMMIT_PULL_REQUEST_DRAFT == "false"'
  - event: pull_request_metadata
    evaluate:
      'CI_PIPELINE_EVENT_REASON == "ready_for_review" &&
      CI_COMMIT_PULL_REQUEST_DRAFT == "false"'

steps:
  - name: trusted-ci-policy
    image: node:22.12.0-bookworm@sha256:0e910f435308c36ea60b4cfd7b80208044d77a074d16b768a81901ce938a62dc
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - tooling/ci/ci-self-protection.sh
    failure: cancel

  - name: firewall
    image: node:22.12.0-bookworm@sha256:0e910f435308c36ea60b4cfd7b80208044d77a074d16b768a81901ce938a62dc
    environment:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=6144"
    commands:
      - tooling/ci/firewall.sh
    depends_on:
      - trusted-ci-policy
    failure: cancel

  - name: bounded-ai-review
    image: node:22.12.0-bookworm@sha256:0e910f435308c36ea60b4cfd7b80208044d77a074d16b768a81901ce938a62dc
    environment:
      CI: "true"
      GITHUB_TOKEN:
        from_secret: github_token
      OPENROUTER_API_KEY:
        from_secret: openrouter_api_key
    commands:
      - |
        BASE_BRANCH="${CI_COMMIT_TARGET_BRANCH:-main}"
        TRUSTED_TREE="$(mktemp -d)"
        trap 'rm -rf "$TRUSTED_TREE"' EXIT
        git archive "origin/${BASE_BRANCH}" AGENTS.md tooling/quality package.json pnpm-lock.yaml pnpm-workspace.yaml | tar -x -C "$TRUSTED_TREE"
        export CONTRACT_REVIEW_WORKTREE="$CI_WORKSPACE"
        export TASTE_REVIEW_WORKTREE="$CI_WORKSPACE"
        pnpm exec tsx "$TRUSTED_TREE/tooling/quality/ai-review-cycle.mts"
    depends_on:
      - firewall
    failure: cancel
