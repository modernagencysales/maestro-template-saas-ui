# qlty reports what ESLint cannot: cross-file duplication (identical/similar
# code) plus secret and dependency findings. Internal block mode preserves
# finding severity, while repository wrappers keep every local and CI call
# advisory.
config_version = "0"

exclude_patterns = [
  "**/node_modules/**",
  "**/dist/**",
  "**/coverage/**",
  "**/_generated/**",
  "apps/web/src/routeTree.gen.ts",
  "packages/template-core/src/generated/**",
  "packages/template-core/src/generated/confectManifest.ts",
  "**/packages/template-core/src/generated/confectManifest.ts",
  "**/*.d.ts",
  "pnpm-lock.yaml",
  "tooling/**",
  "repos/**",
  ".pnpm-store/**",
]

test_patterns = [
  "**/*.test.*",
  "**/*.spec.*",
  "**/__tests__/**",
  "**/test/**",
]

[[source]]
name = "default"
default = true

# Structural smells retain block severity inside Qlty so findings stay visible.
# ESLint owns deterministic changed-file complexity; Qlty adds advisory
# cross-file duplication and full-repository maintainability reporting.
[smells]
mode = "block"

[smells.identical_code]
threshold = 12
[smells.similar_code]
threshold = 15
[smells.function_complexity]
threshold = 10
[smells.file_complexity]
threshold = 50
[smells.return_statements]
threshold = 5
[smells.boolean_logic]
threshold = 4
[smells.function_parameters]
threshold = 5
[smells.nested_control_flow]
threshold = 4

[[triage]]
match.rules = ["qlty:similar-code"]
match.file_patterns = ["packages/template-core/src/generated/confectManifest.ts"]
set.ignored = true

[[exclude]]
plugins = ["qlty"]
file_patterns = ["packages/template-core/src/generated/confectManifest.ts"]

# PR #5 introduces the productized Agent Pack in one 480-commit import. Qlty
# has no repository-owned fingerprint baseline, so the exact imported
# rule/path pairs below are monitored as the initial debt ledger. A new
# file/rule pair remains a visible finding, but the repository wrapper reports
# it without becoming an admission authority. Remove paths from this ledger as
# they are refactored; see the maintainability baseline for the capture and
# removal contract.
#
# Immutable release payloads and generated example seeds remain scanned by
# gitleaks and osv-scanner, while copied-source maintainability is monitored.
[[triage]]
match.plugins = ["qlty"]
match.file_patterns = ["releases/**", "examples/**/seed/source/**"]
set.mode = "monitor"

