env:
  SECRET_SCANNER_VERSION: "8.30.1"
  PROMOTION_AUTHORITY_ENDPOINT: "${PROMOTION_AUTHORITY_ENDPOINT}"
  TRUSTED_DEPLOY_ROOT_SHA256: "${TRUSTED_DEPLOY_ROOT_SHA256}"
  TRUSTED_CI_SELF_PROTECTION_COMMIT: "${TRUSTED_CI_SELF_PROTECTION_COMMIT}"
  TRUSTED_ROLLBACK_SEED_COMMIT: "${TRUSTED_ROLLBACK_SEED_COMMIT}"
  ROLLBACK_RECEIPT_BUILD_ID: "${ROLLBACK_RECEIPT_BUILD_ID}"
  TEMPLATE_STAGING_CONVEX_DEPLOYMENT: "${TEMPLATE_STAGING_CONVEX_DEPLOYMENT}"
  TEMPLATE_STAGING_CONVEX_URL: "${TEMPLATE_STAGING_CONVEX_URL}"
  TEMPLATE_STAGING_HOSTED_URL: "${TEMPLATE_STAGING_HOSTED_URL}"
  TEMPLATE_PRODUCTION_CONVEX_DEPLOYMENT: "${TEMPLATE_PRODUCTION_CONVEX_DEPLOYMENT}"
  TEMPLATE_PRODUCTION_CONVEX_URL: "${TEMPLATE_PRODUCTION_CONVEX_URL}"
  TEMPLATE_PRODUCTION_HOSTED_URL: "${TEMPLATE_PRODUCTION_HOSTED_URL}"

