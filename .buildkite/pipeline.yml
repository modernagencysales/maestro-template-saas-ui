# pnpm check:confect-compat
# pnpm check:workflow-semantics
# pnpm template:workflow-output-smoke
# pnpm check:workflow-graph-boundary
# pnpm check:schema-migration-notes
# pnpm check:system-catalog
# pnpm check:system-topology
# pnpm check:data-resources
# pnpm check:append-only-tables
# pnpm check:promotion-boundary
# pnpm check:layer-boundaries
# pnpm check:secret-canaries
# pnpm check:sbom-license
# pnpm check:headless-surface-contract
# pnpm check:posthog-readiness
# pnpm check:auth-demo-bypass
# pnpm check:pr-health
# pnpm check:unresolved-review-threads
# pnpm check:merge-conflicts
# pnpm check:qlty

# Steps route to Buildkite hosted queues by weight (linux-small/medium/large).
# Secrets come from cluster secrets via the step-level `secrets:` attribute;
# each environment's provider credentials use distinct TEMPLATE_STAGING_* or
# TEMPLATE_PRODUCTION_* names so neither deploy can inherit another target's
# credentials by accident.
steps:
  # Secretless self-protection: fail before any credentialed job runs if the
  # PR weakens the CI gate structure. This step must never receive secrets.
  - label: ":shield: ci-self-protection"
    key: "ci-self-protection"
    command: |
      set -euo pipefail
      if [[ ! "$${TRUSTED_CI_SELF_PROTECTION_COMMIT}" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
        echo "TRUSTED_CI_SELF_PROTECTION_COMMIT must be an exact immutable commit SHA." >&2
        exit 1
      fi
      git cat-file -e "$${TRUSTED_CI_SELF_PROTECTION_COMMIT}^{commit}"
      if [[ "$$(git rev-parse "$${TRUSTED_CI_SELF_PROTECTION_COMMIT}^{commit}")" != "$${TRUSTED_CI_SELF_PROTECTION_COMMIT}" ]]; then
        echo "Trusted self-protection commit did not resolve exactly." >&2
        exit 1
      fi
      TRUSTED_SELF_PROTECTION_DIR="$$(mktemp -d)"
      trap 'rm -rf "$${TRUSTED_SELF_PROTECTION_DIR}"' EXIT
      TRUSTED_SETUP_PATH="$${TRUSTED_SELF_PROTECTION_DIR}/setup.sh"
      TRUSTED_VERIFIER_PATH="$${TRUSTED_SELF_PROTECTION_DIR}/check-deploy-authority.mts"
      TRUSTED_SELF_PROTECTION_PATH="$${TRUSTED_SELF_PROTECTION_DIR}/ci-self-protection.sh"
      git show "$${TRUSTED_CI_SELF_PROTECTION_COMMIT}:.buildkite/scripts/setup.sh" > "$${TRUSTED_SETUP_PATH}"
      git show "$${TRUSTED_CI_SELF_PROTECTION_COMMIT}:tooling/quality/check-deploy-authority.mts" > "$${TRUSTED_VERIFIER_PATH}"
      git show "$${TRUSTED_CI_SELF_PROTECTION_COMMIT}:.buildkite/scripts/ci-self-protection.sh" > "$${TRUSTED_SELF_PROTECTION_PATH}"
      export npm_config_ignore_scripts=true
      source "$${TRUSTED_SETUP_PATH}"
      if [[ "$$(node --version)" != "v22.12.0" ]]; then
        echo "Trusted verifier requires pinned Node v22.12.0." >&2
        exit 1
      fi
      node --experimental-strip-types "$${TRUSTED_VERIFIER_PATH}"
      TEMPLATE_CI_SETUP=skip bash "$${TRUSTED_SELF_PROTECTION_PATH}"
      unset npm_config_ignore_scripts
    agents:
      queue: "linux-small"

  - label: ":pipeline: phase-1 deterministic gates"
    key: "phase-1"
    depends_on: "ci-self-protection"
    command: ".buildkite/scripts/phase1.sh"
    secrets:
      - GITHUB_TOKEN
    agents:
      queue: "linux-medium"

  - label: ":brain: taste"
    key: "taste"
    depends_on: "phase-1"
    command: ".buildkite/scripts/taste.sh"
    timeout_in_minutes: 20
    secrets:
      - GITHUB_TOKEN
      - OPENROUTER_API_KEY
      - OPENAI_API_KEY
    agents:
      queue: "linux-medium"

  - label: ":shield: contract review"
    key: "contract-review"
    depends_on: "phase-1"
    command: ".buildkite/scripts/contract-review.sh"
    timeout_in_minutes: 20
    secrets:
      - GITHUB_TOKEN
      - OPENROUTER_API_KEY
      - OPENAI_API_KEY
    agents:
      queue: "linux-medium"

  - label: ":test_tube: mutation"
    key: "mutation"
    if: build.source == "schedule" || build.env("RUN_MUTATION") == "true"
    command: ".buildkite/scripts/mutation.sh"
    agents:
      queue: "linux-large"

  - label: ":shield: staging authority preflight"
    key: "staging-authority-preflight"
    if: build.branch == "main" && build.pull_request.id == null
    depends_on: "phase-1"
    command:
      "node scripts/_project-config.mjs assert-isolated-convex && pnpm exec tsx
      tooling/release/src/deploy/authorityCli.ts staging ${BUILDKITE_COMMIT}
      template-staging $(node scripts/_project-config.mjs get staging convexUrl)"
    agents:
      queue: "linux-small"

  - label: ":rocket: staging deploy"
    key: "staging-deploy"
    if: build.branch == "main" && build.pull_request.id == null
    depends_on: "staging-authority-preflight"
    command: ".buildkite/scripts/staging-deploy.sh"
    env:
      PROMOTION_TARGET_ID: "template-staging"
      PREVIOUS_CONVEX_COMMIT_SHA: "${STAGING_PREVIOUS_CONVEX_COMMIT_SHA}"
      PREVIOUS_CONVEX_DEPLOYMENT: "${STAGING_PREVIOUS_CONVEX_DEPLOYMENT}"
      PREVIOUS_CLOUDFLARE_DEPLOYMENT_VERSION: "${STAGING_PREVIOUS_CLOUDFLARE_DEPLOYMENT_VERSION}"
    secrets:
      - TEMPLATE_STAGING_CLOUDFLARE_API_TOKEN
      - TEMPLATE_STAGING_CLOUDFLARE_ACCOUNT_ID
      - TEMPLATE_STAGING_CONVEX_DEPLOY_KEY
    agents:
      queue: "linux-medium"

  - block: "Promote the exact staged commit to production"
    key: "production-approval"
    if: build.branch == "main" && build.pull_request.id == null
    depends_on: "staging-deploy"

  - label: ":shield: production authority preflight"
    key: "production-authority-preflight"
    if: build.branch == "main" && build.pull_request.id == null
    depends_on: "production-approval"
    command:
      "node scripts/_project-config.mjs assert-isolated-convex && pnpm exec tsx
      tooling/release/src/deploy/authorityCli.ts production ${BUILDKITE_COMMIT}
      template-production $(node scripts/_project-config.mjs get production
      convexUrl)"
    agents:
      queue: "linux-small"

  - label: ":rocket: production promote"
    key: "production-promote"
    if: build.branch == "main" && build.pull_request.id == null
    depends_on: "production-authority-preflight"
    command: ".buildkite/scripts/production-promote.sh"
    env:
      PROMOTION_TARGET_ID: "template-production"
      PREVIOUS_CONVEX_COMMIT_SHA: "${PRODUCTION_PREVIOUS_CONVEX_COMMIT_SHA}"
      PREVIOUS_CONVEX_DEPLOYMENT: "${PRODUCTION_PREVIOUS_CONVEX_DEPLOYMENT}"
      PREVIOUS_CLOUDFLARE_DEPLOYMENT_VERSION: "${PRODUCTION_PREVIOUS_CLOUDFLARE_DEPLOYMENT_VERSION}"
      ROLLBACK_CLOUDFLARE_DEPLOYMENT_VERSION: "${ROLLBACK_CLOUDFLARE_DEPLOYMENT_VERSION}"
      ROLLBACK_RECEIPT_PATH: "${ROLLBACK_RECEIPT_PATH}"
    secrets:
      - TEMPLATE_PRODUCTION_CLOUDFLARE_API_TOKEN
      - TEMPLATE_PRODUCTION_CLOUDFLARE_ACCOUNT_ID
      - TEMPLATE_PRODUCTION_CONVEX_DEPLOY_KEY
    agents:
      queue: "linux-medium"

  - wait: ~
    continue_on_failure: true

  - label: ":memo: prompt/eval artifact upload"
    key: "eval-artifacts"
    command: "echo 'prompt/eval artifacts are non-fatal during bootstrap'"
    soft_fail: true
    agents:
      queue: "linux-small"

# Graphite CI optimizer is enabled when credentials are configured. Local and
# fork runs intentionally no-op rather than requiring Graphite auth.
# Merge-queue builds may reuse a prior passing AI verdict for the same PR while
# deterministic gates rerun from scratch.
