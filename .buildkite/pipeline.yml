# Steps route to Buildkite hosted queues by weight (linux-small/medium/large).
# Secrets come from cluster secrets via the step-level `secrets:` attribute;
# the template's Convex key is namespaced TEMPLATE_CONVEX_DEPLOY_KEY so this
# pipeline can never pick up another pipeline's deploy key by accident.
steps:
  # Secretless self-protection: fail before any credentialed job runs if the
  # PR weakens the CI gate structure. This step must never receive secrets.
  - label: ":shield: ci-self-protection"
    key: "ci-self-protection"
    command: ".buildkite/scripts/ci-self-protection.sh"
    agents:
      queue: "linux-small"

  - label: ":pipeline: phase-1 deterministic gates"
    key: "phase-1"
    depends_on: "ci-self-protection"
    command: ".buildkite/scripts/phase1.sh"
    secrets:
      - GITHUB_TOKEN
    agents:
      queue: "linux-medium"

  - label: ":brain: taste"
    key: "taste"
    depends_on: "phase-1"
    command: ".buildkite/scripts/taste.sh"
    timeout_in_minutes: 20
    secrets:
      - GITHUB_TOKEN
      - OPENROUTER_API_KEY
      - OPENAI_API_KEY
    agents:
      queue: "linux-medium"

  - label: ":shield: contract review"
    key: "contract-review"
    depends_on: "phase-1"
    command: ".buildkite/scripts/contract-review.sh"
    timeout_in_minutes: 20
    secrets:
      - GITHUB_TOKEN
      - OPENROUTER_API_KEY
      - OPENAI_API_KEY
    agents:
      queue: "linux-medium"

  - label: ":test_tube: mutation"
    key: "mutation"
    if: build.source == "schedule" || build.env("RUN_MUTATION") == "true"
    command: ".buildkite/scripts/mutation.sh"
    agents:
      queue: "linux-large"

  - label: ":rocket: staging deploy"
    key: "staging-deploy"
    if: build.branch == "main" && build.pull_request.id == null
    depends_on: "phase-1"
    command: ".buildkite/scripts/staging-deploy.sh"
    env:
      PROMOTION_TARGET_ID: "template-staging"
    secrets:
      - TEMPLATE_CLOUDFLARE_API_TOKEN
      - TEMPLATE_CLOUDFLARE_ACCOUNT_ID
      - TEMPLATE_CONVEX_DEPLOY_KEY
    agents:
      queue: "linux-medium"

  - block: "Promote the exact staged commit to production"
    key: "production-approval"
    if: build.branch == "main" && build.pull_request.id == null
    depends_on: "staging-deploy"

  - label: ":rocket: production promote"
    key: "production-promote"
    if: build.branch == "main" && build.pull_request.id == null
    depends_on: "production-approval"
    command: ".buildkite/scripts/production-promote.sh"
    env:
      PROMOTION_TARGET_ID: "template-production"
    secrets:
      - TEMPLATE_CLOUDFLARE_API_TOKEN
      - TEMPLATE_CLOUDFLARE_ACCOUNT_ID
      - TEMPLATE_CONVEX_DEPLOY_KEY
    agents:
      queue: "linux-medium"

  - wait: ~
    continue_on_failure: true

  - label: ":memo: prompt/eval artifact upload"
    key: "eval-artifacts"
    command: "echo 'prompt/eval artifacts are non-fatal during bootstrap'"
    soft_fail: true
    agents:
      queue: "linux-small"

# Graphite CI optimizer is enabled when credentials are configured. Local and
# fork runs intentionally no-op rather than requiring Graphite auth.
# Merge-queue builds may reuse a prior passing AI verdict for the same PR while
# deterministic gates rerun from scratch.
