name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install
      - name: Run database migrations
        run: pnpm --filter @workspace/db db:push --force
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tests
      - name: Seed database
        run: pnpm --filter @workspace/db db:seed --email admin@example.com --password secure123
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tests
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tests
          AUTH_SECRET: '1234567890'
          APP_URL: http://localhost:3000
          VITE_API_URL: http://localhost:3000
          # STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
