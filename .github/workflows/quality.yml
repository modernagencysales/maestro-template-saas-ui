name: Required quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Seed immutable release dependencies
        run: bash tooling/ci/seed-frozen-alpha2-store.sh
      - name: Install pinned scanners
        run: |
          bash tooling/ci/install-gitleaks.sh
          bash tooling/ci/install-qlty.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Verify production promotion contract
        run: pnpm verify
