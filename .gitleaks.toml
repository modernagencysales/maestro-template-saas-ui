title = "maestro-template secret scan"

[[allowlists]]
description = "Dependency, generated build, and vendored reference trees are not source secrets."
paths = [
  '''(^|/)\.git/''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)repos/''',
  '''(^|/)vendor/''',
  '''(^|/)test-results/''',
  '''(^|/)coverage/''',
  '''^tooling/agent-pack/evals/runs/''',
  '''(^|/).stryker-tmp/''',
  '''(^|/)\.pnpm-store/'''
]

[[rules]]
id = "generic-api-key"
description = "Generic API key assignment"
regex = '''(?i)(api[_-]?key|secret|token)\s*[:=]\s*['"][A-Za-z0-9_\-]{20,}['"]'''
tags = ["key", "secret"]
